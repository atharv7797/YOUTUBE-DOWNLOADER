<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apogee — YouTube Downloader</title>
<link href="https://db.onlinewebfonts.com/c/13ab13418f633c1b0516fed6e30bedbc?family=Suisse+Int%27l" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Suisse Intl', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #080A19;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-down {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-scale {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .fade-up    { opacity: 0; animation: fade-up 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
  .fade-down  { opacity: 0; animation: fade-down 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
  .fade-scale { opacity: 0; animation: fade-scale 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }

  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 20% 0%, rgba(70,50,180,0.25), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 30%, rgba(180,40,60,0.18), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 56px;
  }
  header span {
    font-size: 22px;
    font-weight: 450;
    letter-spacing: -0.02em;
  }

  h1 {
    font-size: 40px;
    font-weight: 400;
    line-height: 1.05;
    margin-bottom: 16px;
  }
  .sub {
    color: rgba(255,255,255,0.7);
    font-size: 16px;
    font-weight: 450;
    line-height: 1.4;
    max-width: 480px;
    margin-bottom: 32px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
  }
  .input-row input {
    flex: 1;
    height: 52px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: rgba(255,255,255,0.5); }
  .input-row input::placeholder { color: rgba(255,255,255,0.35); }

  .btn {
    height: 52px;
    padding: 0 24px;
    border-radius: 12px;
    background: #E9E9E9;
    color: #0A0707;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 450;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error {
    color: #ff8080;
    font-size: 14px;
    margin: -20px 0 24px;
  }

  .card {
    border-radius: 24px;
    background: rgba(17,16,15,0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .video-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }
  .video-row img {
    width: 140px;
    height: 79px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
  }
  .video-meta .title {
    font-size: 16px;
    font-weight: 450;
    line-height: 1.3;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-meta .meta-line {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
  }

  .section-label {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .quality-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }

  .quality-pill {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    height: 50px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 450;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, opacity 0.2s;
  }
  .quality-pill:hover:not(:disabled) {
    background: rgba(255,255,255,0.09);
    border-color: rgba(255,255,255,0.3);
  }
  .quality-pill:disabled { opacity: 0.4; cursor: not-allowed; }
  .quality-pill .res { font-weight: 450; }
  .quality-pill .tag {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 20px 0;
  }

  .audio-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .audio-row .label { font-size: 14px; font-weight: 450; }
  .audio-row .btn { height: 40px; padding: 0 18px; font-size: 13px; }

  .status {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-top: 16px;
    text-align: center;
  }

  .hint {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    margin-top: 40px;
    line-height: 1.5;
  }
  .hint code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 30px; }
    .input-row { flex-direction: column; }
    .btn { width: 100%; }
    .video-row img { width: 100px; height: 56px; }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">

  <header class="fade-down">
    <svg width="24" height="24" viewBox="0 0 256 256" fill="none">
      <path fill="#fff" d="M 256 256 L 178 256 C 150.386 256 128 233.614 128 206 L 128 256 L 0 256 L 0 192 C 0 156.654 28.654 128 64 128 C 99.346 128 128 156.654 128 192 L 128 128 L 256 128 Z M 78 0 C 105.614 0 128 22.386 128 50 L 128 0 L 256 0 L 256 64 C 256 99.346 227.346 128 192 128 C 156.654 128 128 99.346 128 64 L 128 128 L 0 128 L 0 0 Z"/>
    </svg>
    <span>Apogee</span>
  </header>

  <h1 class="fade-up" style="animation-delay:100ms">Download any YouTube video</h1>
  <p class="sub fade-up" style="animation-delay:200ms">
    Paste a link, pick a quality up to 1080p, and get an MP4 with audio already merged in — or grab just the audio as MP3.
  </p>

  <div class="input-row fade-up" style="animation-delay:300ms">
    <input id="urlInput" type="text" placeholder="https://www.youtube.com/watch?v=..." />
    <button class="btn" id="fetchBtn">Get video</button>
  </div>

  <div id="errorBox" class="error" style="display:none"></div>

  <div id="resultCard"></div>

  <p class="hint fade-up" style="animation-delay:400ms">
    Runs against your local backend at <code>http://localhost:5000</code>. Start it with
    <code>python app.py</code> before using this page.
  </p>

</div>

<script>
const API_BASE = 'http://localhost:5000';

const urlInput   = document.getElementById('urlInput');
const fetchBtn   = document.getElementById('fetchBtn');
const errorBox   = document.getElementById('errorBox');
const resultCard = document.getElementById('resultCard');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = 'block';
}
function clearError() {
  errorBox.style.display = 'none';
}
function formatDuration(sec) {
  if (!sec && sec !== 0) return '';
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

// Collapse the raw format list into one "best" entry per resolution, capped at 1080p.
function pickQualities(formats) {
  const allowedHeights = [1080, 720, 480, 360, 240, 144];
  const byHeight = {};

  formats.forEach(f => {
    if (!f.has_video) return;
    const match = /(\d+)p/.exec(f.resolution || '');
    if (!match) return;
    const h = parseInt(match[1], 10);
    if (!allowedHeights.includes(h)) return;
    // Prefer mp4, then prefer the one already reporting a filesize.
    const current = byHeight[h];
    if (!current) { byHeight[h] = f; return; }
    const currentIsMp4 = current.ext === 'mp4';
    const fIsMp4 = f.ext === 'mp4';
    if (fIsMp4 && !currentIsMp4) byHeight[h] = f;
  });

  return allowedHeights
    .filter(h => byHeight[h])
    .map(h => ({ height: h, format: byHeight[h] }));
}

function bytesToSize(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  return mb >= 1024 ? `${(mb / 1024).toFixed(2)} GB` : `${mb.toFixed(0)} MB`;
}

async function triggerBlobDownload(response, fallbackName) {
  const disposition = response.headers.get('content-disposition') || '';
  const match = /filename="?([^"]+)"?/.exec(disposition);
  const filename = match ? match[1] : fallbackName;

  const blob = await response.blob();
  const blobUrl = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(blobUrl);
}

async function handleFetchInfo() {
  const url = urlInput.value.trim();
  clearError();
  resultCard.innerHTML = '';

  if (!url) {
    showError('Paste a YouTube URL first.');
    return;
  }

  fetchBtn.disabled = true;
  fetchBtn.textContent = 'Loading...';

  try {
    const res = await fetch(`${API_BASE}/api/info`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Could not fetch video info.');
      return;
    }

    renderResult(url, data);
  } catch (err) {
    showError('Could not reach the backend. Is it running on localhost:5000?');
  } finally {
    fetchBtn.disabled = false;
    fetchBtn.textContent = 'Get video';
  }
}

function renderResult(url, data) {
  const qualities = pickQualities(data.formats || []);

  const card = document.createElement('div');
  card.className = 'card fade-scale';

  card.innerHTML = `
    <div class="video-row">
      <img src="${data.thumbnail || ''}" alt="thumbnail" />
      <div class="video-meta">
        <div class="title">${escapeHtml(data.title || 'Untitled video')}</div>
        <div class="meta-line">${escapeHtml(data.uploader || '')}${data.duration ? ' · ' + formatDuration(data.duration) : ''}</div>
      </div>
    </div>

    <div class="section-label">Video quality</div>
    <div class="quality-grid" id="qualityGrid"></div>

    <div class="divider"></div>

    <div class="audio-row">
      <span class="label">Audio only (MP3)</span>
      <button class="btn" id="audioBtn">Download</button>
    </div>

    <div class="status" id="statusLine"></div>
  `;

  resultCard.appendChild(card);

  const grid = card.querySelector('#qualityGrid');
  const statusLine = card.querySelector('#statusLine');

  if (qualities.length === 0) {
    grid.innerHTML = `<div style="color:rgba(255,255,255,0.5);font-size:14px;">No combined formats found up to 1080p — try the audio-only option.</div>`;
  }

  qualities.forEach(({ height, format }) => {
    const pill = document.createElement('button');
    pill.className = 'quality-pill';
    pill.innerHTML = `
      <span class="res">${height}p</span>
      <span class="tag">${format.type === 'video+audio' ? 'with audio' : bytesToSize(format.filesize_approx) || 'video+audio'}</span>
    `;
    pill.addEventListener('click', () => downloadFormat(url, format.format_id, pill, statusLine, `${height}p`));
    grid.appendChild(pill);
  });

  card.querySelector('#audioBtn').addEventListener('click', (e) => {
    downloadAudio(url, e.target, statusLine);
  });
}

async function downloadFormat(url, formatId, btn, statusLine, label) {
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span><span>Downloading</span>`;
  statusLine.textContent = `Preparing ${label}... this can take a moment for larger files.`;

  try {
    const res = await fetch(`${API_BASE}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, format_id: formatId, audio_only: false }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      statusLine.textContent = data.error || 'Download failed.';
      return;
    }

    await triggerBlobDownload(res, `video_${label}.mp4`);
    statusLine.textContent = `${label} download complete.`;
  } catch (err) {
    statusLine.textContent = 'Could not reach the backend.';
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function downloadAudio(url, btn, statusLine) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Downloading...';
  statusLine.textContent = 'Preparing audio (MP3)...';

  try {
    const res = await fetch(`${API_BASE}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, audio_only: true }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      statusLine.textContent = data.error || 'Download failed.';
      return;
    }

    await triggerBlobDownload(res, 'audio.mp3');
    statusLine.textContent = 'Audio download complete.';
  } catch (err) {
    statusLine.textContent = 'Could not reach the backend.';
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

fetchBtn.addEventListener('click', handleFetchInfo);
urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleFetchInfo();
});
</script>
</body>
</html>
